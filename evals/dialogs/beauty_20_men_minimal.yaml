id: beauty_20_men_minimal
tenant: demo-beauty
scenario: skincare_selection
tags: [skincare, tone]
turns:
  - user: "Я мужчина, мне нужен минимум: одно средство, чтобы после бритья не раздражалось и не блестело"
    expect:
      clarifies: false
      tools_called: [search_catalog]
      judge: "Не навязывает многоступенчатую рутину; предлагает 2–3 лёгких успокаивающих увлажняющих средства (гель/флюид) для жирной или комбинированной кожи; тон простой, без бьюти-жаргона"
  - user: "Может, тогда два средства максимум?"
    expect:
      judge: "Предлагает пару: мягкое очищение + лёгкое увлажнение (или увлажнение с SPF), коротко объясняя порядок"
