id: beauty_10_gift_partner_known
tenant: demo-beauty
scenario: gift
tags: [gift, fragrance]
turns:
  - user: "Хочу подарить мужу парфюм на годовщину. Он любит древесные ароматы, носит что-то с ветивером. Бюджет до 10 тысяч"
    expect:
      clarifies: false
      tools_called: [search_catalog]
      components: [product_carousel]
      state_contains: { budget: 10000 }
      judge: "Показывает мужские или унисекс древесные ароматы, по возможности с ветивером или родственными нотами, не дороже 10000 ₽; учитывает повод (можно отметить более насыщенные/вечерние варианты)"
  - user: "Он уже такой носит — второй из списка. Есть что-то похожее, но другое?"
    expect:
      tools_called: [search_catalog]
      judge: "Понимает, о каком товаре речь (второй из показанных), исключает его и предлагает альтернативы со схожим профилем, объясняя отличия"
