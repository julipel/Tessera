id: garden_04_care_feeding
tenant: demo-garden
scenario: plant_care
tags: [care, faq, catalog]
# Сезон — в реплике: агент знает дату хода, и осенью весенняя подкормка не нужна.
turns:
  - user: "Сейчас апрель, у туи побурела хвоя. Чем её подкормить и что делать?"
    expect:
      tools_called: [search_knowledge]
      judge: "По базе знаний называет вероятную причину (весенний ожог или зимнее иссушение хвои) и меры — притенение весной, полив, весенняя подкормка для хвойных; не придумывает дозировки и химические препараты"
  - user: "Покажите удобрение для хвойных"
    expect:
      tools_called: [search_catalog, show_entities]
      judge: "Показывает карточками удобрения для хвойных из каталога; выбор объясняет по их описанию и сезону (весной — весеннее, с магнием); дозировку называет только из способа применения или не называет"
