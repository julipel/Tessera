# Боевой стек на одном сервере (P9-01, ADR-0040). Запуск — из корня репозитория через
# make deploy-* (docs/deploy.md): docker compose -f deploy/compose.prod.yml --env-file deploy/.env
# Наружу — только Caddy (80/443): /v1/* и /health → api, остальное → web, один домен.
name: tessera-prod

x-app-env: &app-env
  APP_ENV: production
  # api и worker — ролью приложения без DDL (только DML); migrate — владельцем схемы
  # (deploy/postgres/app-role.sh, REVIEW.md: D-3).
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-tessera_app}:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-app}
  # Пароль Redis и ключ Qdrant: в сети backend их знают только api и worker (REVIEW.md: D-1, D-2).
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?}
  # env_file отдаёт сервису весь deploy/.env: пароль владельца (суперпользователя Postgres)
  # нужен только compose для DATABASE_URL migrate — в окружении контейнеров его нет, иначе
  # RCE в api или worker обходил бы роль приложения (D-3).
  POSTGRES_PASSWORD: ""
  KNOWLEDGE_FILES_DIR: /srv/data/knowledge
  # Свой веб-чат и витрины — на том же origin (ADR-0022, дополнение P9-00b).
  CORS_ORIGINS: '["https://${DOMAIN:?}"]'
  # IP посетителя (лимиты, ADR-0030) uvicorn берёт из X-Forwarded-For только от своей сети
  # compose (там XFF ставит лишь Caddy; web ходит в API без него). С «*» он взял бы крайний
  # левый адрес заголовка — его подделывает клиент, если перед Caddy встанет ещё один прокси
  # (REVIEW.md: S-5).
  FORWARDED_ALLOW_IPS: ${COMPOSE_SUBNET:-172.30.240.0/24}

# Остальные настройки API (ключи LLM, Langfuse, лимиты, SOURCE_SECRET_*) — из env-файла.
x-app: &app
  image: tessera-api:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  # DEPLOY_ENV_FILE — другой файл, например для проверки стека локально (docs/deploy.md).
  env_file: ${DEPLOY_ENV_FILE:-.env}
  environment: *app-env
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Роль приложения создаёт app-role.sh при первом запуске тома; для уже созданного —
      # make deploy-db-roles (docs/deploy.md).
      APP_DB_USER: ${APP_DB_USER:-tessera_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF: очередь синхронизаций (arq) переживает перезапуск. Пароль обязателен: arq
    # разбирает задачи через pickle — запись в очередь равна выполнению кода в воркере (D-1).
    # Пароль — конфигом через stdin, не в argv redis-server.
    command:
      - sh
      - -c
      - |
        exec redis-server - --appendonly yes <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # redis-cli в healthcheck берёт пароль отсюда, не из argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]
    healthcheck:
      # В образе нет curl/wget — проверяем HTTP через bash /dev/tcp; /readyz — без ключа.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Миграции при каждом `up`: api и worker стартуют только после успешного alembic.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    # Остановка: до 15 с uvicorn дожидается ходов (--timeout-graceful-shutdown в Dockerfile),
    # до 3 с lifespan ждёт прерванные ходы, затем отправляет хвост трейсов Langfuse
    # (LANGFUSE_TIMEOUT_S — на каждую пачку, общего предела у SDK нет; 60 с — потолок, дальше
    # SIGKILL). По умолчанию Docker ждёт 10 с — трейсы последних ходов терялись (O-12).
    stop_grace_period: 60s
    # edge — от Caddy и web (X-Forwarded-For доверяется только ей), backend — к хранилищам.
    networks: [edge, backend]
    volumes:
      - knowledge-files:/srv/data/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    volumes:
      - knowledge-files:/srv/data/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    image: tessera-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?}
    environment:
      # CSP страницы /widget (proxy.ts) — запрос к API внутри сети compose.
      API_INTERNAL_URL: http://api:8000
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/demo/shop/index.html').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-86400}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

# Две сети (дополнение ADR-0040, REVIEW.md: D-1): web и Caddy, открытые в интернет, не видят
# Postgres, Redis и Qdrant. backend не internal — api и worker ходят к LLM и сайтам источников.
# edge — своя подсеть: API доверяет X-Forwarded-For только адресам из неё
# (FORWARDED_ALLOW_IPS). Пересекается с сетями сервера или других compose-проектов —
# задать COMPOSE_SUBNET.
networks:
  edge:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.240.0/24}
  backend:

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  knowledge-files:
  caddy-data:
  caddy-config:
