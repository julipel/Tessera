id: garden_05_faq_midflow
tenant: demo-garden
scenario: plant_selection
tags: [faq, context]
turns:
  - user: "Подберите хвойное для живой изгороди на солнечном участке в Москве"
    expect:
      tools_called: [search_catalog, show_entities]
      judge: "Показывает карточками хвойные для изгороди на солнце, зимующие в Москве (подходит туя «Смарагд»); стелющиеся и карликовые не выдаёт за растения для изгороди"
  - user: "А если не приживётся — вернёте деньги? И доставите в Подольск?"
    expect:
      tools_called: [search_knowledge]
      judge: "Отвечает на оба вопроса, и ответ не противоречит базе знаний: гарантия приживаемости до конца сезона (до 31 октября) — замена или возврат денег при посадке в течение 7 дней и сохранённом чеке; в Подольск (Московская область) доставляют за 1–3 дня, 490 ₽ плюс 30 ₽ за км от МКАД"
  - user: "Хорошо, какая из показанных лучше всего для изгороди?"
    expect:
      clarifies: false
      judge: "Возвращается к показанным хвойным и выбирает подходящее для изгороди (например, тую «Смарагд»), обосновывая по атрибутам из каталога"
