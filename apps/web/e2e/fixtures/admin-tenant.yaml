# Тенант e2e админки (admin.spec.ts): свой, чтобы активация конфига не меняла демо-тенантов,
# на которых параллельно идут тесты чата. global-setup сеет его заново — активной снова
# становится эта версия.
tenant:
  slug: e2e-admin
  name: E2E Админка
agent_config:
  assistant:
    name: Ассистент E2E
    greeting: Здравствуйте!
    fallback_message: Не получилось ответить.
  model:
    primary: { provider: openai, name: test-model }
  limits: {}
  prompt:
    tenant: Ты — консультант.
  tools:
    # suggest_replies — ход с инструментом для разбора диалога; форма и заявка — экран заявок
    builtin: [suggest_replies, show_form, create_lead]
  forms:
    consultation:
      title: Консультация E2E
      fields:
        - { name: name, label: Имя, kind: text, required: true }
        - { name: contact, label: Телефон или Telegram, kind: text, required: true }
