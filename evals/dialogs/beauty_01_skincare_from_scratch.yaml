id: beauty_01_skincare_from_scratch
tenant: demo-beauty
scenario: skincare_selection
tags: [skincare, clarification]
turns:
  - user: "Посоветуйте крем для лица"
    expect:
      clarifies: true
      max_questions: 1
      tools_not_called: [show_entities]
  - user: "Кожа сухая, к вечеру стягивает"
    expect:
      tools_called: [search_catalog]
      components: [product_carousel]
      state_contains: { skin_type: dry }
      judge: "Показывает кремы для сухой кожи; объяснение каждого варианта опирается на атрибуты (увлажнение, керамиды, гиалуроновая кислота и т.п.), а не на общие слова"
