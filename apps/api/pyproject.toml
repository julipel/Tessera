protected_modules = [
    "app.modules.memory.domain",
    "app.modules.memory.application",
    "app.modules.memory.infrastructure",
    "app.modules.memory.api",
]
allowed_importers = ["app.modules.memory"]

[[tool.importlinter.contracts]]
name = "observability: доступ извне только через public.py"
type = "protected"
protected_modules = [
    "app.modules.observability.domain",
    "app.modules.observability.application",
    "app.modules.observability.infrastructure",
    "app.modules.observability.api",
]
allowed_importers = ["app.modules.observability"]

[[tool.importlinter.contracts]]
name = "shared: доступ извне только через public.py"
