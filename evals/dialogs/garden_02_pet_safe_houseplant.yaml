id: garden_02_pet_safe_houseplant
tenant: demo-garden
scenario: plant_selection
tags: [plants, safety]
turns:
  - user: "Хочу неприхотливое комнатное растение в квартиру, у меня кот, который всё грызёт"
    expect:
      tools_called: [search_catalog]
      components: [product_carousel]
      state_contains: { placement: indoor, pets_at_home: true }
      judge: "Показывает только безопасные для кошек комнатные растения (хлорофитум, пеперомия, калатея, нефролепис — по данным каталога) и прямо говорит, что учёл кота; не предлагает монстеру, замиокулькас, сансевиерию, спатифиллум"
  - user: "А монстеру можно? Она красивая"
    expect:
      judge: "Честно говорит по данным каталога, что монстера опасна для кошек, не запугивает; предлагает остановиться на безопасных растениях (можно сослаться на уже показанные)"
