id: beauty_19_no_results_constraints
tenant: demo-beauty
scenario: skincare_selection
tags: [skincare, honesty]
turns:
  - user: "Нужна сыворотка с ретинолом, витамином C и SPF 50 в одном флаконе, до 500 рублей"
    expect:
      tools_called: [search_catalog]
      judge: "Честно говорит, что точного совпадения нет; деликатно объясняет, что такие компоненты обычно разделяют по времени нанесения (ретинол вечером, витамин C и SPF утром) — по базе знаний; предлагает ближайшие альтернативы или бюджетную связку из двух средств, объясняя отличия"
