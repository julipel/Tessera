id: garden_03_hardiness_constraint
tenant: demo-garden
scenario: plant_selection
tags: [plants, catalog, honesty]
turns:
  - user: "Посоветуйте цветущий кустарник на солнечное место, чтобы зимовал в Подмосковье без укрытия"
    expect:
      tools_called: [search_catalog]
      components: [product_carousel]
      judge: "Показывает кустарники для солнца с зоной зимостойкости не больше 4 (например, гортензия метельчатая, спирея, сирень, дёрен); не предлагает розу «Вестерленд» как зимующую без укрытия (у неё зона 5)"
  - user: "А роза «Вестерленд» перезимует?"
    expect:
      judge: "По данным каталога и базы знаний объясняет, что у розы зона 5 и в Подмосковье ей нужно укрытие; не обещает, что она перезимует без укрытия"
