allowed_importers = ["app.modules.agent"]

[[tool.importlinter.contracts]]
name = "tools: доступ извне только через public.py"
type = "protected"
protected_modules = [
    "app.modules.tools.domain",
    "app.modules.tools.application",
    "app.modules.tools.infrastructure",
