id: beauty_13_switch_category
tenant: demo-beauty
scenario: skincare_selection
tags: [context, gift, skincare]
turns:
  - user: "Ищу крем для кожи вокруг глаз, кожа сухая, беспокоят мелкие морщинки"
    expect:
      tools_called: [search_catalog]
      state_contains: { skin_type: dry }
  - user: "Кстати, ещё нужен подарок сестре, она обожает цветочные ароматы. До 6000"
    expect:
      tools_called: [search_catalog]
      components: [product_carousel]
      state_contains: { budget: 6000 }
      # Рубрика оценивает ответ, а не слоты: смешение слотов сценариев — P6-05.
      judge: "Переключается на подбор аромата для сестры (цветочные, женские/унисекс, до 6000 ₽); в ответе и подборке не смешивает с параметрами крема (тип кожи, морщинки); сохранённые сведения о запросе не оценивай"
  - user: "Хорошо. А по крему для глаз — что посоветуете из первых вариантов?"
    expect:
      clarifies: false
      judge: "Возвращается к кремам для глаз из первой подборки и даёт рекомендацию с учётом сухой кожи и морщинок; в ответе бюджет 6000 к крему не применяет; сохранённые сведения о запросе не оценивай"
