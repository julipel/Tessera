[project]
name = "app"
version = "0.1.0"
description = "API платформы AI-консультанта"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.24.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]
# Сгенерировано из JSON Schema (make contracts), формат задаёт scripts/contracts.sh.
extend-exclude = ["src/app/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "SIM", "RUF"]
# Кириллица в комментариях и docstrings — норма для проекта, не путаем её с латиницей.
allowed-confusables = ["а", "в", "г", "е", "к", "м", "н", "о", "р", "с", "т", "у", "х", "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations", "evals"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Раннер эвалов (`evals/`, ADR-0011) лежит рядом с src и импортируется тестами.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: тесты с реальными внешними сервисами (LLM-провайдеры и т.п.)"]

# Архитектурные границы (architecture.md §2–3, ADR-0001). Нарушение ломает `make check`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Прод-код не зависит от тестовых инструментов"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["pytest"]

[[tool.importlinter.contracts]]
name = "Слои внутри модуля: api → application | infrastructure → domain"
type = "layers"
layers = ["api", "application | infrastructure", "domain"]
containers = [
    "app.modules.tenants",
    "app.modules.chat",
    "app.modules.agent",
    "app.modules.tools",
    "app.modules.knowledge",
    "app.modules.memory",
    "app.modules.observability",
    "app.modules.shared",
]
exhaustive = true
exhaustive_ignores = ["public", "kernel"]

[[tool.importlinter.contracts]]
name = "Направление зависимостей между модулями"
type = "layers"
layers = [
    "app.modules.chat",
    "app.modules.agent",
    "app.modules.tools | app.modules.memory | app.modules.tenants",
    "app.modules.knowledge",
    "app.modules.observability",
    "app.modules.shared",
]

[[tool.importlinter.contracts]]
name = "domain и kernel модулей не зависят от фреймворков, БД и SDK"
type = "forbidden"
source_modules = ["app.modules.*.domain", "app.modules.*.kernel"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic_settings",
    "httpx",
    "structlog",
    "redis",
    "arq",
    "qdrant_client",
    "openai",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "agent не знает про HTTP"
type = "forbidden"
source_modules = ["app.modules.agent"]
forbidden_modules = ["fastapi", "starlette"]

# Внутренности модуля доступны только ему самому; остальным — только public.py.

[[tool.importlinter.contracts]]
name = "tenants: доступ извне только через public.py"
type = "protected"
protected_modules = [
    "app.modules.tenants.domain",
    "app.modules.tenants.application",
    "app.modules.tenants.infrastructure",
    "app.modules.tenants.api",
]
allowed_importers = ["app.modules.tenants"]

[[tool.importlinter.contracts]]
name = "chat: доступ извне только через public.py"
type = "protected"
protected_modules = [
    "app.modules.chat.domain",
    "app.modules.chat.application",
    "app.modules.chat.infrastructure",
    "app.modules.chat.api",
