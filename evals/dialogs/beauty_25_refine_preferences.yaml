id: beauty_25_refine_preferences
tenant: demo-beauty
scenario: fragrance_selection
tags: [fragrance, state]
# P6-06: клиент повторно уточняет сказанное — в facts уточнённый факт заменяет прежний,
# а не копится рядом пересказом (ADR-0039).
turns:
  - user: "Ищу аромат для себя на каждый день. Работаю в небольшом офисе, у коллеги аллергия на резкие запахи"
    expect:
      max_facts: 2
  - user: "Уточню: у коллеги аллергия именно на цветочные ароматы. И мне самой от резких запахов бывает плохо — болит голова"
    expect:
      max_facts: 3
      judge: "Учитывает аллергию коллеги на цветочные и головную боль от резких запахов: не предлагает цветочные и насыщенные ароматы. В сохранённых фактах нет двух формулировок одного и того же (прежней и уточнённой версии про аллергию коллеги)"
  - user: "И ещё раз про офис: нас там трое в одной комнате, так что аромат нужен совсем тихий, почти незаметный"
    expect:
      max_facts: 4
      judge: "Предлагает или ищет лёгкие, тихие ароматы без цветочных нот. В сохранённых фактах нет двух формулировок одного и того же сведения (прежней и уточнённой); факты с разными сведениями об одном предмете (например, размер офиса и число людей в комнате) — не повтор"
